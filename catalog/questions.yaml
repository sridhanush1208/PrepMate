# Interview practice questions, written in our own words.
# Each: id, topic, difficulty (1-3), text, hint, points (what a good answer covers)
questions:
  # ---------- Complexity ----------
  - id: q_complexity_1
    topic: complexity
    difficulty: 1
    text: "What does O(n log n) mean? Give one algorithm that runs in this time and explain why."
    hint: "Think about an algorithm that splits the input in half repeatedly and does linear work at each level."
    points: ["Describes growth rate as input size n grows", "Names merge sort (or heap sort)", "log n levels of splitting", "O(n) work per level"]
  - id: q_complexity_2
    topic: complexity
    difficulty: 1
    text: "Two loops run one after another, each over n items. Then a nested loop runs over the same n items. What is the total time complexity?"
    hint: "Add the costs, then keep only the biggest term."
    points: ["Sequential loops: O(n) + O(n)", "Nested loop: O(n^2)", "Total O(n^2) by dropping smaller terms"]

  # ---------- Arrays ----------
  - id: q_arrays_1
    topic: arrays
    difficulty: 1
    text: "How would you rotate an array of n elements to the right by k steps using O(1) extra space?"
    hint: "Reversing parts of the array can help. Try reversing three times."
    points: ["Handle k = k mod n", "Reverse whole array", "Reverse first k and the rest separately", "O(n) time, O(1) space"]
  - id: q_arrays_2
    topic: arrays
    difficulty: 1
    text: "Given an array, move all zeros to the end while keeping the order of the other elements. Explain your approach."
    hint: "Keep a write index for the next non-zero element."
    points: ["Write pointer for non-zero elements", "Single pass", "Fill remaining positions with zeros or swap", "O(n) time, O(1) space"]

  # ---------- Strings ----------
  - id: q_strings_1
    topic: strings
    difficulty: 1
    text: "How do you check whether two strings are anagrams of each other?"
    hint: "Count how many times each character appears."
    points: ["Lengths must match", "Count characters with an array or hashmap", "Compare counts", "Alternative: sort both, O(n log n)"]
  - id: q_strings_2
    topic: strings
    difficulty: 2
    text: "How would you check if a string is a palindrome while ignoring spaces and punctuation?"
    hint: "Use two pointers from both ends and skip characters that are not letters or digits."
    points: ["Two pointers from both ends", "Skip non-alphanumeric characters", "Compare case-insensitively", "O(n) time, O(1) space"]

  # ---------- Hashing ----------
  - id: q_hashing_1
    topic: hashing
    difficulty: 1
    text: "Find two numbers in an array that add up to a target. How can you do it in one pass?"
    hint: "While scanning, remember the numbers you have already seen."
    points: ["Hashmap from value to index", "For each x, check if target - x is in the map", "O(n) time, O(n) space"]
  - id: q_hashing_2
    topic: hashing
    difficulty: 2
    text: "What is a hash collision and how do hash tables handle it?"
    hint: "Two keys land in the same bucket. There are two common fixes."
    points: ["Different keys map to the same bucket", "Chaining with lists", "Open addressing / probing", "Load factor and resizing"]

  # ---------- Two pointers ----------
  - id: q_two_pointers_1
    topic: two_pointers
    difficulty: 1
    text: "In a sorted array, find whether any pair sums to a target without using extra space."
    hint: "Start one pointer at each end and move based on the current sum."
    points: ["Left and right pointers", "Sum too small: move left; too big: move right", "O(n) time, O(1) space", "Works because the array is sorted"]
  - id: q_two_pointers_2
    topic: two_pointers
    difficulty: 2
    text: "Remove duplicates from a sorted array in place and return the new length."
    hint: "A slow pointer marks where the next unique value should go."
    points: ["Slow and fast pointers", "Copy when a new value is found", "Return slow + 1", "O(n) time, O(1) space"]

  # ---------- Prefix sums ----------
  - id: q_prefix_sums_1
    topic: prefix_sums
    difficulty: 1
    text: "You get many queries asking for the sum of elements between index l and r. How do you answer each in O(1)?"
    hint: "Precompute running totals once."
    points: ["Build prefix array once in O(n)", "sum(l, r) = prefix[r+1] - prefix[l]", "Each query O(1)"]
  - id: q_prefix_sums_2
    topic: prefix_sums
    difficulty: 2
    text: "Count the number of subarrays whose sum equals k."
    hint: "Combine prefix sums with a hashmap of how often each prefix sum has appeared."
    points: ["Running prefix sum", "Hashmap counts of prefix sums", "Add count of (prefix - k)", "Initialize map with {0: 1}", "O(n)"]

  # ---------- Sliding window ----------
  - id: q_sliding_window_1
    topic: sliding_window
    difficulty: 2
    text: "Find the length of the longest substring without repeating characters."
    hint: "Grow the window on the right; shrink from the left when a character repeats."
    points: ["Window with left and right pointers", "Set or map of characters in window", "Move left past the duplicate", "Track max length", "O(n)"]
  - id: q_sliding_window_2
    topic: sliding_window
    difficulty: 1
    text: "Find the maximum sum of any subarray of exactly size k."
    hint: "When the window slides, add the new element and subtract the one that left."
    points: ["Sum of first k elements", "Slide: add new, remove old", "Track maximum", "O(n) instead of O(nk)"]

  # ---------- Sorting ----------
  - id: q_sorting_1
    topic: sorting
    difficulty: 2
    text: "Compare quicksort and merge sort: time complexity, space, and when you would pick each."
    hint: "Think about worst case, extra memory, and stability."
    points: ["Both average O(n log n)", "Quicksort worst case O(n^2)", "Merge sort needs O(n) extra space", "Merge sort is stable", "Quicksort is fast in practice / in place"]
  - id: q_sorting_2
    topic: sorting
    difficulty: 1
    text: "What does it mean for a sorting algorithm to be stable, and why does it matter?"
    hint: "Think about two records with the same key."
    points: ["Equal keys keep their original order", "Matters when sorting by multiple fields", "Example of a stable sort (merge, insertion)"]

  # ---------- Binary search ----------
  - id: q_binary_search_1
    topic: binary_search
    difficulty: 1
    text: "Find the first position of a target in a sorted array that may contain duplicates."
    hint: "When you find the target, don't stop; keep searching on the left side."
    points: ["Standard low/high loop", "On match, record and move high left", "Avoid overflow in mid", "O(log n)"]
  - id: q_binary_search_2
    topic: binary_search
    difficulty: 2
    text: "A sorted array was rotated at an unknown point. How do you search for a value in O(log n)?"
    hint: "At every step, one half of the array is still sorted."
    points: ["Find which half is sorted", "Check if target lies in the sorted half", "Discard the other half", "O(log n)"]

  # ---------- Recursion ----------
  - id: q_recursion_1
    topic: recursion
    difficulty: 1
    text: "What is a base case in recursion and what happens if you forget it?"
    hint: "Think about when the function should stop calling itself."
    points: ["Condition that stops recursion", "Without it: infinite recursion", "Stack overflow", "Example like factorial(0) = 1"]
  - id: q_recursion_2
    topic: recursion
    difficulty: 2
    text: "How does the call stack work when you compute fibonacci(4) recursively? Why is naive recursion slow here?"
    hint: "Draw the call tree and look for repeated calls."
    points: ["Each call pushes a stack frame", "Call tree branches twice", "Same subproblems computed many times", "Exponential time; memoization fixes it"]

  # ---------- Backtracking ----------
  - id: q_backtracking_1
    topic: backtracking
    difficulty: 2
    text: "How would you generate all subsets of a set of distinct numbers?"
    hint: "For each element, you either include it or you don't."
    points: ["Include / exclude choice per element", "Recursive helper with current list", "Undo choice after recursion (backtrack)", "2^n subsets"]
  - id: q_backtracking_2
    topic: backtracking
    difficulty: 3
    text: "Explain how you would solve the N-Queens problem."
    hint: "Place one queen per row and check columns and diagonals before placing."
    points: ["Place row by row", "Track used columns and both diagonals", "Recurse to next row", "Remove queen when backtracking"]

  # ---------- Linked lists ----------
  - id: q_linked_lists_1
    topic: linked_lists
    difficulty: 1
    text: "How do you reverse a singly linked list?"
    hint: "Walk the list while keeping track of the previous node."
    points: ["prev, curr, next pointers", "Point curr.next to prev", "Move forward", "Return prev as new head", "O(n), O(1) space"]
  - id: q_linked_lists_2
    topic: linked_lists
    difficulty: 2
    text: "How do you detect a cycle in a linked list?"
    hint: "Use two pointers moving at different speeds."
    points: ["Slow moves 1, fast moves 2", "If they meet, there is a cycle", "If fast reaches null, no cycle", "O(1) extra space"]

  # ---------- Stacks ----------
  - id: q_stacks_1
    topic: stacks
    difficulty: 1
    text: "How do you check if a string of brackets like '({[]})' is balanced?"
    hint: "Push opening brackets; check the top when you see a closing one."
    points: ["Push opening brackets", "On closing, top must match", "Stack empty at end", "O(n)"]
  - id: q_stacks_2
    topic: stacks
    difficulty: 2
    text: "Design a stack that returns the minimum element in O(1) time."
    hint: "Keep a second stack that tracks the minimum so far."
    points: ["Second stack of minimums", "Push to min stack when value <= current min", "Pop from both when needed", "All operations O(1)"]

  # ---------- Queues ----------
  - id: q_queues_1
    topic: queues
    difficulty: 1
    text: "What is the difference between a stack and a queue? Give one real-world use of a queue."
    hint: "Think about which element comes out first."
    points: ["Stack is LIFO", "Queue is FIFO", "Enqueue at back, dequeue from front", "Example: printer jobs, BFS, task scheduling"]
  - id: q_queues_2
    topic: queues
    difficulty: 2
    text: "How would you implement a queue using two stacks?"
    hint: "One stack for incoming items, one for outgoing; move items only when the outgoing stack is empty."
    points: ["Input stack and output stack", "Push to input", "Pop from output; refill from input when empty", "Amortized O(1)"]

  # ---------- Monotonic stack ----------
  - id: q_monotonic_stack_1
    topic: monotonic_stack
    difficulty: 2
    text: "For each element in an array, find the next greater element to its right."
    hint: "Keep a stack of elements still waiting for their answer."
    points: ["Stack holds indices with no answer yet", "Pop while current is greater, set their answer", "Push current", "O(n)"]
  - id: q_monotonic_stack_2
    topic: monotonic_stack
    difficulty: 3
    text: "Given daily temperatures, find how many days each day must wait for a warmer temperature."
    hint: "This is next greater element, but you store the distance."
    points: ["Decreasing stack of indices", "On warmer day, pop and compute index difference", "Default 0 if none", "O(n)"]

  # ---------- Trees ----------
  - id: q_trees_1
    topic: trees
    difficulty: 1
    text: "How do you find the height (maximum depth) of a binary tree?"
    hint: "The height of a node depends on the heights of its children."
    points: ["Recursive: 1 + max(left, right)", "Base case: null has height 0", "O(n) time"]
  - id: q_trees_2
    topic: trees
    difficulty: 2
    text: "How do you check if a binary tree is balanced?"
    hint: "Compute heights bottom-up and stop early when the difference is more than 1."
    points: ["Left and right heights differ by at most 1 at every node", "Bottom-up recursion", "Return -1 / flag when unbalanced", "O(n)"]

  # ---------- Tree traversals ----------
  - id: q_tree_traversals_1
    topic: tree_traversals
    difficulty: 1
    text: "Explain inorder, preorder and postorder traversal. Which one gives sorted output for a BST?"
    hint: "The name tells you when the root is visited."
    points: ["Preorder: root, left, right", "Inorder: left, root, right", "Postorder: left, right, root", "Inorder of BST is sorted"]
  - id: q_tree_traversals_2
    topic: tree_traversals
    difficulty: 2
    text: "How would you print a binary tree level by level?"
    hint: "Use a queue and process one level's size at a time."
    points: ["Queue starting with root", "Process current queue size as one level", "Add children to queue", "O(n)"]

  # ---------- BST ----------
  - id: q_bst_1
    topic: bst
    difficulty: 2
    text: "How do you check if a binary tree is a valid binary search tree?"
    hint: "Each node must lie within a range given by its ancestors, not just its parent."
    points: ["Pass min and max bounds", "Left subtree < node < right subtree", "Or inorder traversal must be strictly increasing", "O(n)"]
  - id: q_bst_2
    topic: bst
    difficulty: 2
    text: "Find the k-th smallest element in a BST."
    hint: "Inorder traversal visits nodes in sorted order."
    points: ["Inorder traversal", "Count nodes visited", "Stop at k-th", "O(h + k)"]

  # ---------- Heaps ----------
  - id: q_heaps_1
    topic: heaps
    difficulty: 2
    text: "How do you find the k largest elements in a large array efficiently?"
    hint: "Keep a min-heap of size k."
    points: ["Min-heap of size k", "Push each element; pop if size > k", "Heap holds k largest", "O(n log k)"]
  - id: q_heaps_2
    topic: heaps
    difficulty: 2
    text: "What is a heap, and what are the time complexities of insert and extract-min?"
    hint: "It is a complete binary tree stored in an array."
    points: ["Complete binary tree, heap property", "Stored in an array (children at 2i+1, 2i+2)", "Insert O(log n)", "Extract O(log n)", "Peek O(1)"]

  # ---------- Tries ----------
  - id: q_tries_1
    topic: tries
    difficulty: 2
    text: "What is a trie and why is it useful for autocomplete?"
    hint: "Each edge represents one character of a word."
    points: ["Tree of characters", "Common prefixes share nodes", "End-of-word marker", "Prefix lookup in O(length of prefix)"]
  - id: q_tries_2
    topic: tries
    difficulty: 3
    text: "How would you count how many stored words start with a given prefix?"
    hint: "Store a counter at each trie node."
    points: ["Increment count at each node during insert", "Walk down the prefix", "Return count at last node", "0 if prefix path missing"]

  # ---------- Graph basics ----------
  - id: q_graph_basics_1
    topic: graph_basics
    difficulty: 1
    text: "Compare adjacency list and adjacency matrix representations of a graph."
    hint: "Think about memory and how fast you can check if an edge exists."
    points: ["Matrix O(V^2) space, O(1) edge check", "List O(V + E) space", "List better for sparse graphs", "Matrix better for dense graphs"]
  - id: q_graph_basics_2
    topic: graph_basics
    difficulty: 1
    text: "What is the difference between a directed and an undirected graph? Give one example of each."
    hint: "Does the connection go both ways?"
    points: ["Directed edges have a direction", "Undirected edges go both ways", "Example directed: Twitter follows", "Example undirected: Facebook friends / roads"]

  # ---------- BFS ----------
  - id: q_bfs_1
    topic: bfs
    difficulty: 2
    text: "Explain how BFS finds the shortest path in an unweighted graph."
    hint: "BFS explores the graph in layers: first all nodes 1 step away, then 2 steps..."
    points: ["Uses a queue", "Visits nodes level by level", "Mark visited when enqueued", "First time reaching a node = shortest distance", "O(V + E)"]
  - id: q_bfs_2
    topic: bfs
    difficulty: 2
    text: "In a grid of land and water, how would you count the number of islands using BFS?"
    hint: "Start a BFS from every unvisited land cell; each start is a new island."
    points: ["Scan every cell", "BFS from unvisited land, marking connected land", "Count number of BFS starts", "4-directional neighbours", "O(rows x cols)"]

  # ---------- DFS ----------
  - id: q_dfs_1
    topic: dfs
    difficulty: 2
    text: "How do you detect a cycle in a directed graph using DFS?"
    hint: "Track which nodes are on the current recursion path."
    points: ["Three states: unvisited, visiting, done", "Edge to a 'visiting' node means a cycle", "Mark done after exploring", "O(V + E)"]
  - id: q_dfs_2
    topic: dfs
    difficulty: 1
    text: "What is the difference between BFS and DFS, and when would you use each?"
    hint: "One uses a queue, the other a stack or recursion."
    points: ["BFS uses queue, explores level by level", "DFS uses stack/recursion, goes deep first", "BFS for shortest path in unweighted graphs", "DFS for cycles, connectivity, topological order"]

  # ---------- Topological sort ----------
  - id: q_topo_sort_1
    topic: topo_sort
    difficulty: 2
    text: "Given courses and their prerequisites, how do you find a valid order to take all courses?"
    hint: "Start with courses that have no prerequisites left."
    points: ["Directed graph of prerequisites", "Kahn's algorithm with in-degrees and a queue", "Or DFS post-order", "If not all nodes processed, there is a cycle"]
  - id: q_topo_sort_2
    topic: topo_sort
    difficulty: 2
    text: "Why does topological sort only work on directed acyclic graphs?"
    hint: "What happens to the ordering if A must come before B and B before A?"
    points: ["Needs an order where every edge goes forward", "A cycle makes this impossible", "Cycle detection is a by-product"]

  # ---------- Union-find ----------
  - id: q_union_find_1
    topic: union_find
    difficulty: 2
    text: "What is Union-Find (Disjoint Set Union) and what are its two main operations?"
    hint: "Each set has a representative (root)."
    points: ["find(x) returns the root", "union(a, b) merges sets", "Path compression", "Union by rank/size", "Nearly O(1) amortized"]
  - id: q_union_find_2
    topic: union_find
    difficulty: 2
    text: "How can Union-Find detect a cycle in an undirected graph?"
    hint: "Process edges one by one and check if both ends are already connected."
    points: ["For each edge, find both roots", "Same root means cycle", "Otherwise union them"]

  # ---------- Dijkstra ----------
  - id: q_dijkstra_1
    topic: dijkstra
    difficulty: 3
    text: "Explain Dijkstra's algorithm and its time complexity with a priority queue."
    hint: "Always expand the closest node not yet finalised."
    points: ["Distances start at infinity, source 0", "Min-heap by distance", "Relax neighbours", "O((V + E) log V)", "No negative edges"]
  - id: q_dijkstra_2
    topic: dijkstra
    difficulty: 3
    text: "Why does Dijkstra fail with negative edge weights, and what can you use instead?"
    hint: "Once a node is finalised, Dijkstra never revisits it."
    points: ["Assumes finalised distance can't improve", "Negative edge can make it shorter later", "Use Bellman-Ford", "Bellman-Ford also detects negative cycles"]

  # ---------- Greedy ----------
  - id: q_greedy_1
    topic: greedy
    difficulty: 2
    text: "Given meeting time intervals, what is the maximum number of non-overlapping meetings you can attend?"
    hint: "Sort by end time."
    points: ["Sort by end time", "Pick a meeting if it starts after last chosen end", "Greedy choice is safe", "O(n log n)"]
  - id: q_greedy_2
    topic: greedy
    difficulty: 2
    text: "When does a greedy algorithm work, and how is it different from dynamic programming?"
    hint: "Think about whether a locally best choice can ever be wrong later."
    points: ["Greedy picks the local best each step", "Works when greedy-choice property holds", "DP explores and combines subproblems", "Coin change counterexample for greedy"]

  # ---------- DP basics ----------
  - id: q_dp_basics_1
    topic: dp_basics
    difficulty: 2
    text: "How many ways can you climb n stairs if you can take 1 or 2 steps at a time?"
    hint: "Ways(n) depends on Ways(n-1) and Ways(n-2)."
    points: ["Recurrence ways(n) = ways(n-1) + ways(n-2)", "Base cases", "Bottom-up or memoization", "O(n) time, O(1) space possible"]
  - id: q_dp_basics_2
    topic: dp_basics
    difficulty: 2
    text: "What is the difference between memoization and tabulation?"
    hint: "Top-down vs bottom-up."
    points: ["Memoization: recursion + cache, top-down", "Tabulation: fill a table iteratively, bottom-up", "Same time complexity usually", "Tabulation avoids recursion depth"]

  # ---------- DP knapsack ----------
  - id: q_dp_knapsack_1
    topic: dp_knapsack
    difficulty: 3
    text: "Explain the 0/1 knapsack problem and its DP solution."
    hint: "For each item, decide take or skip, with the remaining capacity as part of the state."
    points: ["State dp[i][w]", "Skip: dp[i-1][w]", "Take: value + dp[i-1][w - weight]", "O(n x W)", "1D array optimisation"]
  - id: q_dp_knapsack_2
    topic: dp_knapsack
    difficulty: 3
    text: "How do you find the length of the longest common subsequence of two strings?"
    hint: "Compare the last characters of both prefixes."
    points: ["dp[i][j] for prefixes", "Match: 1 + dp[i-1][j-1]", "No match: max(dp[i-1][j], dp[i][j-1])", "O(m x n)"]

  # ---------- Bits ----------
  - id: q_bits_1
    topic: bits
    difficulty: 1
    text: "How do you check if a number is a power of two using bit operations?"
    hint: "Powers of two have exactly one bit set."
    points: ["n > 0", "n & (n - 1) == 0", "Explains why: removes lowest set bit"]
  - id: q_bits_2
    topic: bits
    difficulty: 2
    text: "Every number in an array appears twice except one. How do you find it in O(1) space?"
    hint: "XOR of a number with itself is zero."
    points: ["XOR all numbers", "Pairs cancel out", "Result is the single number", "O(n) time, O(1) space"]

  # ---------- OOP ----------
  - id: q_oop_1
    topic: oop
    difficulty: 1
    text: "Explain the four pillars of OOP with a small example."
    hint: "Encapsulation, abstraction, inheritance, polymorphism."
    points: ["Encapsulation: hide data behind methods", "Abstraction: expose only what's needed", "Inheritance: reuse via parent class", "Polymorphism: same call, different behaviour", "Concrete example"]
  - id: q_oop_2
    topic: oop
    difficulty: 1
    text: "What is the difference between method overloading and method overriding?"
    hint: "One happens at compile time, the other at runtime."
    points: ["Overloading: same name, different parameters, same class", "Overriding: subclass redefines parent method", "Compile-time vs runtime polymorphism"]

  # ---------- SOLID ----------
  - id: q_solid_1
    topic: solid
    difficulty: 2
    text: "What does the Single Responsibility Principle say? Give an example of a class that breaks it."
    hint: "A class should have only one reason to change."
    points: ["One reason to change", "Example: class that does business logic and saving to file", "Split into separate classes", "Easier testing and changes"]
  - id: q_solid_2
    topic: solid
    difficulty: 2
    text: "Explain the Open/Closed Principle with an example."
    hint: "Add new behaviour without editing existing, tested code."
    points: ["Open for extension, closed for modification", "Use interfaces or inheritance", "Example: new payment type as a new class", "Avoid long if-else chains"]

  # ---------- SQL basics ----------
  - id: q_sql_basics_1
    topic: sql_basics
    difficulty: 1
    text: "What is the difference between a primary key and a foreign key?"
    hint: "One identifies rows in its own table; the other points to another table."
    points: ["Primary key uniquely identifies a row, not null", "Foreign key references a primary key elsewhere", "Enforces referential integrity"]
  - id: q_sql_basics_2
    topic: sql_basics
    difficulty: 1
    text: "What is the difference between DELETE, TRUNCATE and DROP?"
    hint: "Think about rows, the table itself, and whether you can filter or roll back."
    points: ["DELETE removes rows, can use WHERE", "TRUNCATE removes all rows quickly", "DROP removes the table itself", "Rollback / logging differences"]

  # ---------- SQL joins ----------
  - id: q_sql_joins_1
    topic: sql_joins
    difficulty: 1
    text: "Explain INNER JOIN vs LEFT JOIN with an example of students and courses."
    hint: "What happens to a student who has no course?"
    points: ["INNER returns only matching rows", "LEFT keeps all left rows", "Non-matching right columns are NULL", "Example with students and enrollments"]
  - id: q_sql_joins_2
    topic: sql_joins
    difficulty: 2
    text: "How would you find the second highest salary from an Employee table?"
    hint: "Think about the highest salary that is less than the maximum."
    points: ["Subquery with MAX where salary < MAX", "Or DISTINCT + ORDER BY + LIMIT/OFFSET", "Or DENSE_RANK", "Handle duplicates / no second value"]

  # ---------- Normalization ----------
  - id: q_normalization_1
    topic: normalization
    difficulty: 2
    text: "What are 1NF, 2NF and 3NF?"
    hint: "Atomic values, then partial dependencies, then transitive dependencies."
    points: ["1NF: atomic values, no repeating groups", "2NF: no partial dependency on part of a composite key", "3NF: no transitive dependency", "Goal: reduce redundancy"]
  - id: q_normalization_2
    topic: normalization
    difficulty: 2
    text: "Why might you denormalize a database on purpose?"
    hint: "Think about read speed versus duplicate data."
    points: ["Fewer joins, faster reads", "Cost: duplicated data, update anomalies", "Common in reporting / read-heavy systems"]

  # ---------- Transactions ----------
  - id: q_transactions_1
    topic: transactions
    difficulty: 1
    text: "What does ACID stand for? Explain each with a bank transfer example."
    hint: "Atomicity, Consistency, Isolation, Durability."
    points: ["Atomicity: all or nothing", "Consistency: rules remain valid", "Isolation: concurrent transfers don't interfere", "Durability: saved after commit"]
  - id: q_transactions_2
    topic: transactions
    difficulty: 2
    text: "What is a dirty read, and which isolation level prevents it?"
    hint: "Reading data that another transaction hasn't committed yet."
    points: ["Reading uncommitted changes", "Problem if the other transaction rolls back", "READ COMMITTED or higher prevents it", "Mentions other anomalies (non-repeatable, phantom)"]

  # ---------- Indexing ----------
  - id: q_indexing_1
    topic: indexing
    difficulty: 2
    text: "How does a database index speed up queries, and what does it cost?"
    hint: "Think of the index at the back of a book."
    points: ["Avoids full table scan", "Usually a B-tree / B+ tree", "Lookup O(log n)", "Costs extra storage and slower writes"]
  - id: q_indexing_2
    topic: indexing
    difficulty: 3
    text: "Why do databases use B+ trees instead of binary search trees for indexes?"
    hint: "Think about disk pages and tree height."
    points: ["High fan-out, very short tree", "Fewer disk reads", "Leaves linked for range scans", "Data only in leaves (B+)"]

  # ---------- Processes ----------
  - id: q_processes_1
    topic: processes
    difficulty: 1
    text: "What is the difference between a process and a thread?"
    hint: "Think about what they share."
    points: ["Process has its own memory space", "Threads share memory of their process", "Threads are lighter to create/switch", "Process crash is isolated"]
  - id: q_processes_2
    topic: processes
    difficulty: 2
    text: "What is a context switch and why is it expensive?"
    hint: "The CPU must save one task's state and load another's."
    points: ["Save registers / PC of current task", "Load state of next task", "Cache and TLB effects", "No useful work done during switch"]

  # ---------- Scheduling ----------
  - id: q_scheduling_1
    topic: scheduling
    difficulty: 1
    text: "Compare FCFS, SJF and Round Robin scheduling."
    hint: "Think about fairness and average waiting time."
    points: ["FCFS: simple, convoy effect", "SJF: lowest average wait, needs burst time, starvation", "Round Robin: time quantum, fair, good for interactive"]
  - id: q_scheduling_2
    topic: scheduling
    difficulty: 2
    text: "What is starvation in scheduling and how can aging fix it?"
    hint: "A low-priority process may never get the CPU."
    points: ["Process waits indefinitely", "Happens with priority/SJF scheduling", "Aging slowly raises priority of waiting processes"]

  # ---------- Synchronization ----------
  - id: q_synchronization_1
    topic: synchronization
    difficulty: 2
    text: "What is a race condition? Give an example and a fix."
    hint: "Two threads updating a shared counter at the same time."
    points: ["Result depends on timing of threads", "Example: counter++ by two threads", "Fix with mutex / lock / atomic", "Critical section"]
  - id: q_synchronization_2
    topic: synchronization
    difficulty: 2
    text: "What is the difference between a mutex and a semaphore?"
    hint: "One is about ownership and one thread at a time; the other counts."
    points: ["Mutex: one owner, lock/unlock", "Semaphore: counter, allows N threads", "Binary semaphore vs mutex ownership difference", "Example use for each"]

  # ---------- Deadlocks ----------
  - id: q_deadlocks_1
    topic: deadlocks
    difficulty: 2
    text: "What are the four necessary conditions for a deadlock?"
    hint: "Coffman conditions."
    points: ["Mutual exclusion", "Hold and wait", "No preemption", "Circular wait"]
  - id: q_deadlocks_2
    topic: deadlocks
    difficulty: 2
    text: "How can you prevent deadlocks in a program that takes multiple locks?"
    hint: "Break one of the four conditions; the easiest is circular wait."
    points: ["Always acquire locks in a fixed global order", "Use timeouts / tryLock", "Acquire all locks at once", "Mentions Banker's algorithm for avoidance"]

  # ---------- Memory management ----------
  - id: q_memory_mgmt_1
    topic: memory_mgmt
    difficulty: 2
    text: "What is paging and why do operating systems use it?"
    hint: "Memory is split into fixed-size blocks."
    points: ["Fixed-size pages and frames", "Page table maps virtual to physical", "Removes external fragmentation", "Enables virtual memory"]
  - id: q_memory_mgmt_2
    topic: memory_mgmt
    difficulty: 2
    text: "What is a page fault and what is thrashing?"
    hint: "What happens when the page you need is not in RAM?"
    points: ["Page fault: page not in memory, loaded from disk", "Thrashing: too many page faults", "System spends time swapping instead of working", "Fix: more RAM / fewer processes / working set"]

  # ---------- OSI ----------
  - id: q_osi_1
    topic: osi
    difficulty: 1
    text: "Name the layers of the OSI model and give one protocol for three of them."
    hint: "Physical, Data link, Network, Transport, Session, Presentation, Application."
    points: ["All 7 layers in order", "Network: IP", "Transport: TCP/UDP", "Application: HTTP/DNS"]
  - id: q_osi_2
    topic: osi
    difficulty: 2
    text: "What is the difference between a switch and a router?"
    hint: "Which layer does each work at?"
    points: ["Switch: layer 2, MAC addresses, within a LAN", "Router: layer 3, IP addresses, between networks", "Router does path selection"]

  # ---------- TCP/UDP ----------
  - id: q_tcp_udp_1
    topic: tcp_udp
    difficulty: 1
    text: "Compare TCP and UDP. When would you choose UDP?"
    hint: "Reliability versus speed."
    points: ["TCP: connection, reliable, ordered", "UDP: connectionless, no guarantees", "UDP lower overhead", "UDP for video calls, games, DNS"]
  - id: q_tcp_udp_2
    topic: tcp_udp
    difficulty: 2
    text: "Explain the TCP three-way handshake."
    hint: "SYN, SYN-ACK, ACK."
