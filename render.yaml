# Render Blueprint: free Docker web service (FalkorDB + API + UI in one container).
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: prepmate
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODELS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODELS
        sync: false
