[project]
name = "prepmate"
version = "0.1.0"
description = "Multi-agent placement-prep assistant with shared graph memory in FalkorDB"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
